services:
  mongo:
    image: mongo:7
    container_name: dte-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - dte-network

  backend:
    build:
      context: ./server
    container_name: dte-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/dynamic_template_db
      JWT_SECRET: ${JWT_SECRET:-dynamic_template_engine_jwt_secret_key_2026}
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads
    networks:
      - dte-network

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    container_name: dte-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - dte-network

networks:
  dte-network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
